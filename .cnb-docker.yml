# 通用镜像发布：多架构构建并推送到 CNB Docker 制品库
# 合并进 main 推 :latest，打 tag 推同名版本标签；PR 只构建不推送。
# 用法见 README「通用镜像」章节。
main:
  push:
    - name: docker-latest
      services:
        - docker
      env:
        IMAGE_REPO: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      stages:
        - name: docker login
          script: docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"
        - name: build and push
          script: |
            set -e
            docker buildx build \
              --platform "${PLATFORMS}" \
              --build-arg PYTHON_VERSION=3.12 \
              --cache-from type=registry,ref="${IMAGE_REPO}:buildcache" \
              --cache-to type=registry,ref="${IMAGE_REPO}:buildcache",mode=max,image-manifest=true,oci-mediatypes=true \
              --label org.opencontainers.image.source="${CNB_WEB_ENDPOINT}/${CNB_REPO_SLUG}" \
              --label org.opencontainers.image.revision="${CNB_COMMIT}" \
              --label org.opencontainers.image.version="${CNB_BRANCH}" \
              -t "${IMAGE_REPO}:latest" \
              -t "${IMAGE_REPO}:${CNB_COMMIT_SHORT}" \
              --push .

  pull_request:
    - name: docker-build-check
      services:
        - docker
      stages:
        - name: build without push
          script: |
            set -e
            docker buildx build --platform linux/amd64 --build-arg PYTHON_VERSION=3.12 .

$:
  tag_push:
    - name: docker-tag
      services:
        - docker
      env:
        IMAGE_REPO: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
        PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      stages:
        - name: docker login
          script: docker login -u "${CNB_TOKEN_USER_NAME}" -p "${CNB_TOKEN}" "${CNB_DOCKER_REGISTRY}"
        - name: build and push
          script: |
            set -e
            docker buildx build \
              --platform "${PLATFORMS}" \
              --build-arg PYTHON_VERSION=3.12 \
              --cache-from type=registry,ref="${IMAGE_REPO}:buildcache" \
              --cache-to type=registry,ref="${IMAGE_REPO}:buildcache",mode=max,image-manifest=true,oci-mediatypes=true \
              --label org.opencontainers.image.source="${CNB_WEB_ENDPOINT}/${CNB_REPO_SLUG}" \
              --label org.opencontainers.image.revision="${CNB_COMMIT}" \
              --label org.opencontainers.image.version="${CNB_BRANCH}" \
              -t "${IMAGE_REPO}:${CNB_BRANCH}" \
              -t "${IMAGE_REPO}:${CNB_COMMIT_SHORT}" \
              --push .
