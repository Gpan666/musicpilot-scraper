# Docker Hub 镜像发布流水线
#
# 通过根目录 .cnb.yml 的 include 引入，与 GitHub 同步、Release 两套流水线并存：
# 同分支多段 pipeline 会并发执行，某个文件写坏了不会拖累另外两个。
#
# 触发与产物（镜像名固定 docker.io/<DOCKER_HUB_NAMESPACE>/<仓库名小写>）：
#   main  push   → :latest + :sha-<短 SHA> + :edge
#   tag  push    → 语义化标签全家桶（见下）+ :sha-<短 SHA>，正式版同时回写 :latest
#   手工触发     → 选 tag 推送事件重发某个版本；不接 PR，免得 PR 里就能改写 Docker Hub 标签
#
# 语义化标签（tag 形如 v1.2.3 / 1.2.3，预发布后缀 -rc.1 这类不参与主次标签）：
#   v1.2.3 → :v1.2.3 :1.2.3 :v1.2 :1.2 :v1 :1 :latest :sha-xxxxxxx
#   预发布 → 只推 :v1.2.3-rc.1 :1.2.3-rc.1 :sha-xxxxxxx，绝不覆盖 latest
#
# 需要的密钥：在密钥仓库 tsbyj.666/github-sync-secrets 的 docker-hub.yml 里声明
#   DOCKER_HUB_NAMESPACE: 你的 Docker Hub 用户名（或组织名）
#   DOCKER_HUB_USERNAME:  Docker Hub 登录名
#   DOCKER_HUB_TOKEN:     Docker Hub 访问令牌（Access Token，不是账号密码）
#
# 缺密钥时不拖累其它流水线：文件不存在整段流水线跳过（ignoreError），
# 文件在但缺项则只跳过推送、照常构建验证。前提是被引用文件声明了：
#   allow_slugs: tsbyj.666/musicpilot-scraper
#   allow_events: [push, tag_push, api_trigger]
#   allow_branches: [main]

.docker-hub-image: &docker-hub-image
  services:
    - docker
  env:
    PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

# 先确认密钥齐不齐：缺项就跳过推送（不失败），齐了才登录
.docker-hub-stages: &docker-hub-stages
  - name: docker hub login
    script: |
      MISSING=""
      for key in DOCKER_HUB_NAMESPACE DOCKER_HUB_USERNAME DOCKER_HUB_TOKEN; do
        eval "value=\${${key}}"
        [ -n "${value}" ] || MISSING="${MISSING} ${key}"
      done
      if [ -n "${MISSING}" ]; then
        echo "缺少 Docker Hub 凭据:${MISSING}，本次跳过推送"
        echo "##[set-output push=false]"
        exit 0
      fi
      docker login -u "${DOCKER_HUB_USERNAME}" -p "${DOCKER_HUB_TOKEN}" docker.io
    exports:
      push: PUSH_ENABLED

  - name: build and push
    lock: release
    script: |
      set -e

      # tag 推送时 CNB_BRANCH 就是 tag 名
      if [ "${CNB_IS_TAG}" = "true" ]; then
        REF="${CNB_BRANCH}"
      else
        REF=""
      fi

      # ---- 语义化标签推导 ----------------------------------------------
      # VERSION 只用于 OCI 标签与日志，TAGS 才是真正推上去的那几个。
      TAGS=""
      VERSION=""
      PRE=""
      MAJOR=""
      MINOR=""
      PATCH=""
      case "${REF}" in
        v[0-9]*.[0-9]*.[0-9]* | [0-9]*.[0-9]*.[0-9]*)
          CORE="${REF#v}"
          MAJOR="${CORE%%.*}"
          REST="${CORE#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          PRE=""
          case "${PATCH}" in
            *-*) PRE="${PATCH#*-}"; PATCH="${PATCH%%-*}" ;;
          esac
          ;;
      esac

      if [ -n "${MAJOR}" ] && [ -n "${MINOR}" ] && [ -n "${PATCH}" ]; then
        VERSION="${MAJOR}.${MINOR}.${PATCH}"
        [ -n "${PRE}" ] && VERSION="${VERSION}-${PRE}"
        CORE_TAGS="v${VERSION} ${VERSION}"
        if [ -z "${PRE}" ]; then
          # 正式版：主次号 + 大版本号都跟着走，:1 / :1.2 永远指该线最新补丁
          CORE_TAGS="${CORE_TAGS} v${MAJOR}.${MINOR} ${MAJOR}.${MINOR} v${MAJOR} ${MAJOR} latest"
        fi
      elif [ -n "${REF}" ]; then
        # 非语义化 tag（例如 date-20240501）原样推，不带 latest
        VERSION="${REF}"
        CORE_TAGS="${REF}"
      else
        VERSION="edge"
        CORE_TAGS="edge latest"
      fi

      if [ "${PUSH_ENABLED}" = "false" ]; then
        echo "无 Docker Hub 凭据，仅本地构建验证"
        TAGS="-t musicpilot-scraper:${CORE_TAGS%% *}"
        PUSH_FLAG=""
      else
        IMAGE_REPO="docker.io/${DOCKER_HUB_NAMESPACE}/${CNB_REPO_NAME_LOWERCASE}"
        EXTRA_TAGS="${CNB_COMMIT_SHORT:+sha-${CNB_COMMIT_SHORT}}"
        for name in ${CORE_TAGS} ${EXTRA_TAGS}; do
          TAGS="${TAGS} -t ${IMAGE_REPO}:${name}"
        done
        PUSH_FLAG="--push"
      fi

      echo "版本: ${VERSION}"
      echo "推送标签: ${TAGS}"
      docker buildx build \
        --platform "${PLATFORMS}" \
        --build-arg PYTHON_VERSION=3.12 \
        --label org.opencontainers.image.title="${CNB_REPO_NAME}" \
        --label org.opencontainers.image.source="${CNB_WEB_ENDPOINT}/${CNB_REPO_SLUG}" \
        --label org.opencontainers.image.revision="${CNB_COMMIT}" \
        --label org.opencontainers.image.version="${VERSION}" \
        --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        ${TAGS} \
        ${PUSH_FLAG} .

main:
  push:
    - name: docker-hub-edge
      <<: *docker-hub-image
      imports:
        - https://cnb.cool/tsbyj.666/github-sync-secrets/-/blob/main/docker-hub.yml
      stages: *docker-hub-stages

$:
  tag_push:
    - name: docker-hub-release
      <<: *docker-hub-image
      imports:
        - https://cnb.cool/tsbyj.666/github-sync-secrets/-/blob/main/docker-hub.yml
      stages: *docker-hub-stages
