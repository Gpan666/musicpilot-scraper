name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check musicpilot tests
      - name: Test
        run: python -m pytest tests
      - name: Frontend syntax
        run: node --check web/app.js
      - name: Frontend in wheel
        run: |
          python scripts/sync_web.py
          python -m pip wheel . -w dist --no-deps
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any(n.endswith('musicpilot/web/index.html') for n in names), names"
