<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#242424">
  <title>MusicPilot Scraper · 音乐刮削</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <script>
    (function () {
      var saved = localStorage.getItem('mp-theme') || 'dark';
      var theme = saved === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        : saved;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Load webfont non-blocking: an unreachable CDN must never hold up the UI. -->
  <link rel="stylesheet" crossorigin media="print" onload="this.media='all'"
        href="https://cdn.jsdelivr.net/npm/misans@5.0.0/lib/Normal/MiSansVF.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-dashboard" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.2"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 1.8v2.4M12 19.8v2.4M1.8 12h2.4M19.8 12h2.4"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><path d="M9 18V6.4l10-1.9v11.1"/><circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="15.6" r="2.4"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><rect x="3.4" y="5" width="4" height="14" rx="1.4"/><rect x="9.4" y="5" width="4" height="14" rx="1.4"/><path d="M16.2 6.2l3.4.9a1.4 1.4 0 0 1 1 1.7l-3 10.4"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path d="M4 8h13M13.5 4.5 17 8l-3.5 3.5M20 16H7M10.5 12.5 7 16l3.5 3.5"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 7.5l2.2 1.3M17.3 15.2l2.2 1.3M4.5 16.5l2.2-1.3M17.3 8.8l2.2-1.3"/></symbol>
    <symbol id="i-system" viewBox="0 0 24 24"><path d="M4 7.4h5M14 7.4h6M4 16.6h6M15.4 16.6h4.6"/><circle cx="11.5" cy="7.4" r="2.4"/><circle cx="12.7" cy="16.6" r="2.4"/></symbol>
    <symbol id="i-docs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 10.6V17"/><circle cx="12" cy="7.6" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.4"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M5.2 18.8l1.6-1.6M17.2 6.8l1.6-1.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.4v7.6"/><path d="M7.4 6.6a7 7 0 1 0 9.2 0"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19.5v-14M5.5 12 12 5.5 18.5 12"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><rect x="3.2" y="4.4" width="17.6" height="15.2" rx="3"/><path d="M9.4 4.4v15.2M16.6 9.6 13.8 12l2.8 2.4"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><rect x="3.2" y="4.4" width="17.6" height="15.2" rx="3"/><path d="M9.4 4.4v15.2M13.4 9.6 16.2 12l-2.8 2.4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.4"/><path d="M15.8 15.8 20.5 20.5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3.2" y="4.6" width="17.6" height="14.8" rx="2.6"/><path d="M3.2 9.4h17.6M3.2 14.4h17.6M9.6 9.4v10"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="3.4" y="13.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="13.4" width="7.2" height="7.2" rx="2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4.4 19.6h4l10-10a2.4 2.4 0 0 0-3.4-3.4l-10 10z"/><path d="M13.8 7.4l2.8 2.8"/></symbol>
    <symbol id="i-scrape" viewBox="0 0 24 24"><path d="M19.6 12A7.6 7.6 0 1 1 17 6.3"/><path d="M19.8 4.2v4.2h-4.2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.6 7.2h14.8"/><path d="M9.4 7.2V5.4a1.4 1.4 0 0 1 1.4-1.4h2.4a1.4 1.4 0 0 1 1.4 1.4v1.8"/><path d="M6.6 7.2l.9 11.2a1.8 1.8 0 0 0 1.8 1.6h5.4a1.8 1.8 0 0 0 1.8-1.6l.9-11.2"/><path d="M10.6 10.8v5.6M13.4 10.8v5.6"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M6 4.6h9.4l4 4v10.8a1.4 1.4 0 0 1-1.4 1.4H6a1.4 1.4 0 0 1-1.4-1.4V6a1.4 1.4 0 0 1 1.4-1.4z"/><path d="M15 4.8V9h4.2M8.4 12.6h6.2M8.4 16.2h4.2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></symbol>
    <symbol id="i-cover" viewBox="0 0 24 24"><rect x="3.4" y="3.4" width="17.2" height="17.2" rx="3.4"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.4 8.2a2 2 0 0 1 2-2h3.4l2 2.4h7.8a2 2 0 0 1 2 2v7.2a2 2 0 0 1-2 2H5.4a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 24 24"><path d="M3.6 5.2h16.8l-6.6 7.6v6.4l-3.6 1.9v-8.3z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.6l1.9 5.2 5.2 1.9-5.2 1.9-1.9 5.2-1.9-5.2-5.2-1.9 5.2-1.9z"/><path d="M18.4 16.6l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z"/></symbol>
    <symbol id="i-wand" viewBox="0 0 24 24"><path d="M4.6 19.4 14.6 9.4"/><path d="M16.4 4.6 17 6.4l1.8.6-1.8.6-.6 1.8-.6-1.8-1.8-.6 1.8-.6z"/><path d="M19.6 12.4l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M6.4 14.6 12 9l5.6 5.6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6.4 9.4 12 15l5.6-5.6"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 20.4c3.4 0 5.8-2.3 5.8-5.4 0-3.9-3.6-5.3-3-9.9-2.6 1.4-4.2 3.7-4.2 6.2 0 1.1-.6 1.8-1.3 1.8-.9 0-1.4-.8-1.4-1.9-1 1.2-1.7 2.7-1.7 4 0 3 2.4 5.2 5.8 5.2Z"/></symbol>
  </svg>


  <!-- 认证：首次启动注册，之后登录 -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/musicpilot-scraper.png" alt="" class="auth-logo">
        <div>
          <div class="auth-title">MusicPilot Scraper</div>
          <div class="auth-sub">音乐刮削与曲库整理</div>
        </div>
      </div>
      <div id="auth-tabs" class="auth-tabs hidden">
        <button type="button" data-auth-tab="login" class="active">登录</button>
        <button type="button" data-auth-tab="register">创建账号</button>
      </div>
      <h1 id="auth-heading">创建管理员账号</h1>
      <p id="auth-desc" class="auth-desc">首次使用，请先设置一个账号。密码会用 PBKDF2 加盐保存在本机数据库中。</p>
      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span class="field-label">用户名</span>
          <input id="auth-user" type="text" autocomplete="username" placeholder="3–32 位字母、数字、_ . -" required>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input id="auth-pass" type="password" autocomplete="current-password" placeholder="至少 8 位" required>
        </label>
        <label class="field hidden" id="auth-confirm-field">
          <span class="field-label">确认密码</span>
          <input id="auth-confirm" type="password" autocomplete="new-password" placeholder="再输入一次">
        </label>
        <div id="auth-error" class="auth-error" role="alert"></div>
        <button id="auth-submit" class="primary-btn block" type="submit">创建账号并进入</button>
      </form>
      <p class="auth-foot">界面字体 小米 MiSans · 设计参考 Miuix</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <img src="/musicpilot-scraper.png" alt="" class="brand-mark">
          <div class="brand-text">
            <div class="brand-title">MusicPilot Scraper</div>
            <div class="brand-sub">音乐刮削 <span id="version"></span></div>
          </div>
        </div>
        <button id="nav-toggle" class="icon-btn small" title="收起侧边栏" aria-label="收起侧边栏"
                aria-controls="sidebar" aria-expanded="true">
          <span id="nav-toggle-icon"><svg class="icon" aria-hidden="true"><use href="#i-collapse"></use></svg></span>
        </button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <span class="avatar" id="user-avatar">M</span>
          <span class="user-name" id="user-name">—</span>
          <button id="logout-btn" class="icon-btn small" title="退出登录" aria-label="退出登录">
            <svg class="icon" aria-hidden="true"><use href="#i-power"></use></svg>
          </button>
        </div>
        <div class="foot-note">仅做刮削与整理 · GPL-3.0</div>
        <div class="foot-note">字体 小米 MiSans · 设计参考 Miuix</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <div class="topbar-line">
            <button id="nav-open" class="icon-btn" title="展开导航" aria-label="展开导航">
              <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
            </button>
            <h1 id="page-title">概览</h1>
          </div>
          <p id="page-subtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <span id="job-pill" class="pill hidden"></span>
          <button id="theme-toggle" class="icon-btn" title="切换主题" aria-label="切换主题">
            <span id="theme-icon"><svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg></span>
          </button>
        </div>
      </header>
      <div id="banner" class="banner hidden"></div>
      <div id="page" class="page"></div>
    </main>
  </div>

  <!-- 通用详情弹窗 -->
  <div id="modal" class="overlay hidden">
    <div class="dialog">
      <div class="dialog-head">
        <h2 id="modal-title">详情</h2>
        <button id="modal-close" class="icon-btn" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      </div>
      <div id="modal-body" class="dialog-body"></div>
    </div>
  </div>

  <!-- 通用媒体编辑器：全屏，左栏信息 + 右侧四个 Tab；骨架常驻，开关只切 hidden -->
  <div id="media-editor" class="overlay media-editor hidden" aria-hidden="true">
    <div class="me-dialog" role="dialog" aria-modal="true" aria-labelledby="me-title">
      <header class="me-head">
        <div class="me-head-text">
          <h2 id="me-title" data-me-heading>媒体编辑器</h2>
          <p class="me-head-file mono" data-me-filename></p>
        </div>
        <button class="icon-btn" type="button" data-me-close aria-label="关闭编辑器" title="关闭（ESC）">
          <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="me-layout">
        <aside class="me-side" data-me-info></aside>
        <section class="me-main">
          <div class="me-tabs" role="tablist" aria-label="编辑器分区">
            <button class="me-tab" type="button" role="tab" data-me-tab="core" aria-selected="true">核心数据</button>
            <button class="me-tab" type="button" role="tab" data-me-tab="scrape" aria-selected="false">智能刮削</button>
            <button class="me-tab" type="button" role="tab" data-me-tab="lyrics" aria-selected="false">歌词</button>
            <button class="me-tab" type="button" role="tab" data-me-tab="timeline" aria-selected="false">操作历史</button>
          </div>
          <div class="me-body" data-me-body role="tabpanel"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- 任务明细抽屉：从右侧滑出，盖住列表下沿，不再把页面拉到底部 -->
  <div id="drawer" class="drawer-mask hidden" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <div>
          <h2 id="drawer-title">任务明细</h2>
          <p id="drawer-sub" class="drawer-sub"></p>
        </div>
        <button id="drawer-close" class="icon-btn" aria-label="关闭明细"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
      <div class="drawer-foot">
        <span id="drawer-stat" class="small muted"></span>
        <a id="drawer-csv" class="ghost-btn small" href="#">导出表格（CSV）</a>
      </div>
    </aside>
  </div>

  <!-- 文件夹选择器 -->
  <div id="picker" class="overlay hidden">
    <div class="dialog picker-dialog">
      <div class="dialog-head">
        <div>
          <h2 id="picker-title">选择文件夹</h2>
          <p class="dialog-sub">从服务器上的挂载目录中直接选择，无需手动输入路径</p>
        </div>
        <button id="picker-close" class="icon-btn" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button>
      </div>
      <div class="picker-path">
        <span class="picker-root" id="picker-root">/</span>
        <div id="picker-crumbs" class="crumbs"></div>
      </div>
      <div class="picker-toolbar">
        <button id="picker-up" class="ghost-btn small"><svg class="icon" aria-hidden="true"><use href="#i-up"></use></svg>上级</button>
        <button id="picker-home" class="ghost-btn small">根目录</button>
      </div>
      <div id="picker-list" class="picker-list"></div>
      <div class="picker-selected">
        <span class="field-label">当前选择</span>
        <input id="picker-value" class="mono" type="text" spellcheck="false">
      </div>
      <div class="dialog-actions">
        <button id="picker-cancel" class="ghost-btn">取消</button>
        <button id="picker-confirm" class="primary-btn">选择此文件夹</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
